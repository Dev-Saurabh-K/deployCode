name: Deploy App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: saurabh
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd /home/saurabh/deployCode
            git pull origin main
            cd sample
            docker compose up