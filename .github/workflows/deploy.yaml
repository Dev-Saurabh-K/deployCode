name: Deploy App

on:
    push:
        branches:
            - main

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Deploy Via SSH
              uses: appleboy/ssh-action@v1.0.3 
              with: 
                host: ${{ secrets.SSH_HOST }}
                username: root
                password: ${{ secrets.SSH_PASSWORD }}
                script: 
                    cd /home/saurabh/deployCode
                    git pull
                    docker compose up -d --build

